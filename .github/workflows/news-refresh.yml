# Activate in the dedicated scheduler repository as .github/workflows/news-refresh.yml.
name: Refresh World Simple News
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/news-refresh.yml']
permissions:
  contents: write
concurrency:
  group: world-simple-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh sources and verify persisted news
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, time, urllib.error, urllib.request
          origin = 'https://getworldsimple.com'
          def read(path):
              request = urllib.request.Request(origin + path, headers={'User-Agent': 'WorldSimpleScheduler/1.0 (+https://getworldsimple.com/contact)', 'Accept': 'application/json', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          writer = read('/api/news-refresh')
          edition = read('/api/news')['edition']
          for attempt in range(4):
              if not edition.get('refreshing'):
                  break
              time.sleep(2)
              edition = read('/api/news')['edition']
          sources = [source['id'] for source in edition.get('checks', []) if source['ok']]
          assert edition.get('persisted') and edition.get('items'), 'No persisted edition'
          assert edition.get('intervalMinutes') == 5, 'Server interval must be five minutes'
          assert sources and edition.get('lastSuccessAt'), 'No successful source update'
          last_success = datetime.datetime.fromisoformat(edition['lastSuccessAt'].replace('Z', '+00:00')).timestamp()
          assert -60 <= time.time() - last_success < 900, 'Saved edition is not fresh'
          report = {'ok': True, 'refreshed': writer.get('refreshed'), 'persisted': True, 'checkedAt': edition['checkedAt'], 'lastSuccessAt': edition['lastSuccessAt'], 'successfulSources': sources}
          print(json.dumps(report))
          # A daily health checkpoint keeps this public scheduler repository active.
          # Only this public status file is written; no site source or visitor data.
          repository = os.environ['GH_REPOSITORY']
          status_url = 'https://api.github.com/repos/' + repository + '/contents/last-health.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'WorldSimpleNewsHealth'}
          previous = None
          try:
              with urllib.request.urlopen(urllib.request.Request(status_url, headers=headers), timeout=20) as response:
                  previous = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          old = json.loads(base64.b64decode(previous['content'])) if previous else {}
          if old.get('date') != today:
              content = {'date': today, 'checkedAt': edition['checkedAt'], 'lastSuccessAt': edition['lastSuccessAt'], 'successfulSources': sources}
              payload = {'message': 'Record daily news refresh health', 'content': base64.b64encode((json.dumps(content, indent=2) + '\n').encode()).decode(), 'branch': 'main'}
              if previous:
                  payload['sha'] = previous['sha']
              request = urllib.request.Request(status_url, data=json.dumps(payload).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status in (200, 201), 'Health checkpoint was not saved'
          PY
